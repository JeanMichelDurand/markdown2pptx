name: tests

on:
  push:
    branches: [main]            # a pull request's branch is tested by the pull_request event
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3      # settings in pyproject.toml [tool.ruff]

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]            # oldest supported (requires-python) and newest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - name: package installs and runs
        shell: bash
        run: |
          markdown2pptx --version
          for f in examples/*.md; do markdown2pptx "$f" -o smoke.pptx; done

  # The one check branch protection requires (.github/rulesets/main.json): green only when every
  # job above is, so adding or renaming a job never needs a settings change.
  ci-ok:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
