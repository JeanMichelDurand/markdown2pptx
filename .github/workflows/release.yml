# Push a tag matching __version__ in src/markdown2pptx/__init__.py, on the commit of main that has it
# (git switch main && git pull && git tag v1.2.3 && git push origin v1.2.3): tests, builds one
# standalone executable per OS (no Python needed to run it), attaches them to a GitHub release and
# publishes the package to PyPI. Stops at once if the tag and __version__ differ.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04          # oldest glibc still hosted: the binary runs on newer distros
            asset: markdown2pptx-linux-x86_64
            extra: --exclude-module tkinter      # the file dialog is for Windows Explorer only
          - os: windows-latest
            asset: markdown2pptx-windows-x86_64.exe
            extra: ""
          - os: macos-latest
            asset: markdown2pptx-macos-arm64
            extra: --exclude-module tkinter
    runs-on: ${{ matrix.os }}
    env:
      # Windows executable signed by SignPath once the repository secret SIGNPATH_API_TOKEN and the
      # variable SIGNPATH_ORGANIZATION_ID exist (see CODE_SIGNING.md); unsigned until then.
      SIGN: ${{ matrix.os == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tag matches the version
        run: |
          version=$(python -c "import ast, sys; t = ast.parse(open('src/markdown2pptx/__init__.py', encoding='utf-8').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - name: build
        run: pyinstaller --onefile --name markdown2pptx --collect-data pptx ${{ matrix.extra }} --paths src src/markdown2pptx/__main__.py
      - name: smoke test the executable
        run: |
          exe=$(ls dist/markdown2pptx*)
          "$exe" --version
          "$exe" examples/talk.md -o smoke.pptx
          test -s smoke.pptx
          mv "$exe" "dist/${{ matrix.asset }}"
      - id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: markdown2pptx
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: use the signed executable
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "signed/${{ matrix.asset }}"
          if ($sig.Status -ne 'Valid') { throw "signature: $($sig.Status)" }
          Move-Item -Force "signed/${{ matrix.asset }}" "dist/${{ matrix.asset }}"
          & "dist/${{ matrix.asset }}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: create the release, or add the executables to one made by hand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Trusted publishing, no token: on pypi.org, add a "pending publisher" for project markdown2pptx
  # with this repository, workflow release.yml and environment pypi (once, before the first tag).
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/markdown2pptx
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
