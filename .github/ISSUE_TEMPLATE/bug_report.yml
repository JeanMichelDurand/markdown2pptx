name: Bug report
description: Something fails, or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest input that shows the problem. Without it, the bug cannot be reproduced.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: The error message, or what looks wrong.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command line
      placeholder: markdown2pptx talk.md --template brand.pptx
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `markdown2pptx --version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Downloaded executable, pipx / uv tool / pip, Browser version, install.py from a copy of the repo]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System
      placeholder: Windows 11
